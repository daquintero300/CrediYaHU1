server:
  port: 8080
spring:
  application:
    name: "CrediYa"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    tasks: "/api/v1/**"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "authentication"
    schema: "public"
    username: "postgres"
    password: "admin"

springdoc:
  packages-to-scan: co.com.pragma.api
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    co.com.pragma: DEBUG

security:
  jwt:
    key:
      private: 44c85945bf275b34309169995aa43ccf737f9b2f332cdf5da777b664237f635a
    expiration: 3600000
    userGenerator: ADMIN123456

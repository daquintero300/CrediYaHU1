server:
  port: 8080
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    tasks: "/api/v1/**"

adapters:
  r2dbc:
    host: "${ADAPTERS_R2DBC_HOST_AUTHENTICATION}"
    port: "${ADAPTERS_R2DBC_PORT_AUTHENTICATION}"
    database: "${ADAPTERS_R2DBC_DATABASE_AUTHENTICATION}"
    schema: "${ADAPTERS_R2DBC_SCHEMA}"
    username: "${ADAPTERS_R2DBC_USERNAME}"
    password: "${ADAPTERS_R2DBC_PASSWORD}"

springdoc:
  packages-to-scan: co.com.pragma.api
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    co.com.pragma: DEBUG

security:
  jwt:
    key:
      private: "${JWT_KEY_PRIVATE}"
    expiration: "${JWT_EXPIRATION}"
    user-generator: "${JWT_USER_GENERATOR}"
